[mod-name]
Exteros-QoL-Cheats=Exteros QoL System - Cheats

[mod-description]
Exteros-QoL-Cheats=Cheat addon for Exteros' QoL System: reach distance, crafting and mining speed, inventory slots, stack size, productivity on every recipe, fuel stats (fuel value, acceleration, top speed) and recycler return rate for quality upcycling. Replaces Adjustable Fuel Stats and Adjustable Recycler. Nothing changes until you enable Cheat Mode.

[mod-setting-name]
exteros-qol-cheat-mode-enabled=Enable Cheat Mode
exteros-qol-cheat-productivity-unlocked=(Cheat) Unlock Productivity
exteros-qol-cheat-productivity-cap=(Cheat) Productivity Cap (%)
exteros-qol-cheat-stack-size-mode=(Cheat) Stack Size Mode
exteros-qol-cheat-stack-size-value=(Cheat) Stack Size Value
cheat-reach-distance=(Cheat) Reach Distance Bonus
cheat-crafting-speed=(Cheat) Crafting Speed Bonus
cheat-mining-speed=(Cheat) Mining Speed Bonus
cheat-inventory-bonus=(Cheat) Inventory Slots Bonus
exteros-qol-cheat-recycler-return-rate=(Cheat) Recycler Return Rate (%)
exteros-qol-cheat-recycler-scope=(Cheat) Recycler Return Scope

[mod-setting-description]
exteros-qol-cheat-mode-enabled=Enables additional cheat settings (reach, speed, etc.). Must be ON to use any cheats.
exteros-qol-cheat-productivity-unlocked=Allows using productivity modules in ALL recipes. (Requires Cheat Mode)
exteros-qol-cheat-productivity-cap=Sets the maximum productivity percentage for recipes. (Requires Cheat Mode)
exteros-qol-cheat-stack-size-mode=Choose whether to multiply original stack sizes or set an absolute value. (Requires Cheat Mode)
exteros-qol-cheat-stack-size-value=The multiplier or absolute value for stack sizes. (Requires Cheat Mode)
cheat-reach-distance=Increases the distance for building, reaching items, and looting.
cheat-crafting-speed=Increases the manual crafting speed of the player.
cheat-mining-speed=Increases the manual mining speed of the player.
cheat-inventory-bonus=Adds extra slots to the player's inventory.
exteros-qol-cheat-recycler-return-rate=How much the recycler gives back, in percent. Vanilla is 25. Which recipes it affects is set by Recycler Return Scope; scrap is never affected. (Requires Cheat Mode)
exteros-qol-cheat-recycler-scope=Which recycling recipes the return rate applies to. Self-recycling only: items that recycle into themselves (plates, plastic, …). All recipes: every recycling recipe except scrap. (Requires Cheat Mode)

[string-mod-setting]
exteros-qol-cheat-recycler-scope-self-only=Self-recycling only
exteros-qol-cheat-recycler-scope-all=All recipes (except scrap)

[exteros-qol-cheats]
fuel-energy-name=(Cheat) __1__: energy (MJ)
fuel-accel-name=(Cheat) __1__: acceleration
fuel-speed-name=(Cheat) __1__: top speed
fuel-energy-description=Fuel value of __1__ in MJ. Vanilla: __2__. (Requires Cheat Mode)
fuel-accel-description=Vehicle acceleration multiplier when burning __1__. Vanilla: __2__. (Requires Cheat Mode)
fuel-speed-description=Vehicle top speed multiplier when burning __1__. Vanilla: __2__. (Requires Cheat Mode)
