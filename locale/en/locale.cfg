[mod-setting-description]
exteros-qol-cheat-mode-enabled=Enables additional cheat settings (reach, speed, etc.). Must be ON to use any cheats.
exteros-qol-cheat-productivity-unlocked=Allows using productivity modules in ALL recipes. (Requires Cheat Mode)
exteros-qol-cheat-productivity-cap=Sets the maximum productivity percentage for recipes. (Requires Cheat Mode)
exteros-qol-cheat-stack-size-mode=Choose whether to multiply original stack sizes or set an absolute value. (Requires Cheat Mode)
exteros-qol-cheat-stack-size-value=The multiplier or absolute value for stack sizes. (Requires Cheat Mode)
cheat-reach-distance=Increases the distance for building, reaching items, and looting.
cheat-crafting-speed=Increases the manual crafting speed of the player.
cheat-mining-speed=Increases the manual mining speed of the player.
cheat-inventory-bonus=Adds extra slots to the player's inventory.
exteros-qol-cheat-roboport-logistic-radius-mode=Choose whether to multiply the roboport's logistic radius or set an absolute value in tiles. (Requires Cheat Mode)
exteros-qol-cheat-roboport-logistic-radius-value=The multiplier or absolute value, in tiles, for the roboport's logistic radius. (Requires Cheat Mode)
exteros-qol-cheat-roboport-construction-radius-mode=Choose whether to multiply the roboport's construction radius or set an absolute value in tiles. (Requires Cheat Mode)
exteros-qol-cheat-roboport-construction-radius-value=The multiplier or absolute value, in tiles, for the roboport's construction radius. (Requires Cheat Mode)
exteros-qol-cheat-roboport-personal-construction-radius-mode=Choose whether to multiply the personal roboport's construction radius or set an absolute value in tiles. (Requires Cheat Mode)
exteros-qol-cheat-roboport-personal-construction-radius-value=The multiplier or absolute value, in tiles, for the personal roboport's construction radius. (Requires Cheat Mode)
exteros-qol-cheat-roboport-radar-range-mode=Choose whether to multiply the roboport's radar range or set an absolute value, in chunks. Only applies where the roboport has an explicit radar range; otherwise it keeps following its logistic and construction radius as usual. (Requires Cheat Mode)
exteros-qol-cheat-roboport-radar-range-value=The multiplier or absolute value, in chunks, for the roboport's radar range. (Requires Cheat Mode)

