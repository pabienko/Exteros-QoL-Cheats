[mod-name]
Exteros-QoL-Cheats=Exteros' Cheats

[mod-description]
Exteros-QoL-Cheats=Standalone cheat mod: reach distance, crafting/mining speed, inventory slots, stack size, recipe productivity, and roboport ranges. Off by default; character bonuses also need Cheat Mode in Exteros' Hub.

[mod-setting-name]
exteros-cheats-productivity-unlocked=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Unlock
exteros-cheats-productivity-cap=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Cap (%)
exteros-cheats-stack-size-mode=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Mode
exteros-cheats-stack-size-value=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Value
exteros-cheats-roboport-range-logistic-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Logistic Radius Mode
exteros-cheats-roboport-range-logistic-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Logistic Radius Value
exteros-cheats-roboport-range-construction-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Construction Radius Mode
exteros-cheats-roboport-range-construction-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Construction Radius Value
exteros-cheats-roboport-range-personal-construction-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Personal Roboport Construction Radius Mode
exteros-cheats-roboport-range-personal-construction-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Personal Roboport Construction Radius Value
exteros-cheats-roboport-range-radar-range-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Radar Range Mode
exteros-cheats-roboport-range-radar-range-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Radar Range Value

[mod-setting-description]
exteros-cheats-productivity-unlocked=Allows using productivity modules in ALL recipes.
exteros-cheats-productivity-cap=Sets the maximum productivity percentage for recipes.
exteros-cheats-stack-size-mode=Multiply original stack sizes, or set an absolute value.
exteros-cheats-stack-size-value=The multiplier or absolute value for stack sizes.
exteros-cheats-roboport-range-logistic-radius-mode=Multiply the roboport's logistic radius, or set an absolute value in tiles.
exteros-cheats-roboport-range-logistic-radius-value=The multiplier or absolute value, in tiles, for the roboport's logistic radius.
exteros-cheats-roboport-range-construction-radius-mode=Multiply the roboport's construction radius, or set an absolute value in tiles.
exteros-cheats-roboport-range-construction-radius-value=The multiplier or absolute value, in tiles, for the roboport's construction radius.
exteros-cheats-roboport-range-personal-construction-radius-mode=Multiply the personal roboport's construction radius, or set an absolute value in tiles.
exteros-cheats-roboport-range-personal-construction-radius-value=The multiplier or absolute value, in tiles, for the personal roboport's construction radius.
exteros-cheats-roboport-range-radar-range-mode=Multiply the roboport's radar range, or set an absolute value in chunks. Only applies where the roboport has an explicit radar range; otherwise it follows the logistic/construction radius as usual.
exteros-cheats-roboport-range-radar-range-value=The multiplier or absolute value, in chunks, for the roboport's radar range.

[string-mod-setting]
exteros-cheats-stack-size-mode-multiplier=Multiplier
exteros-cheats-stack-size-mode-absolute=Absolute value
exteros-cheats-roboport-range-logistic-radius-mode-multiplier=Multiplier
exteros-cheats-roboport-range-logistic-radius-mode-absolute=Absolute value
exteros-cheats-roboport-range-construction-radius-mode-multiplier=Multiplier
exteros-cheats-roboport-range-construction-radius-mode-absolute=Absolute value
exteros-cheats-roboport-range-personal-construction-radius-mode-multiplier=Multiplier
exteros-cheats-roboport-range-personal-construction-radius-mode-absolute=Absolute value
exteros-cheats-roboport-range-radar-range-mode-multiplier=Multiplier
exteros-cheats-roboport-range-radar-range-mode-absolute=Absolute value

[exteros-lib-feature-name]
exteros-cheats-cheat-mode=Cheat Mode

[exteros-lib-setting-name]
exteros-cheats-cheat-mode-enabled=[item=iron-gear-wheel] [color=#84CDEC]Enable Cheat Mode[/color]
exteros-cheats-cheat-mode-reach-distance=[color=#E0807A][font=default-bold]Character[/font][/color]: Reach Distance Bonus
exteros-cheats-cheat-mode-crafting-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Crafting Speed Bonus
exteros-cheats-cheat-mode-mining-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Mining Speed Bonus
exteros-cheats-cheat-mode-inventory-bonus=[color=#E0807A][font=default-bold]Character[/font][/color]: Inventory Slots Bonus

[exteros-lib-setting-description]
exteros-cheats-cheat-mode-enabled=Applies your character bonuses (reach, crafting/mining speed, inventory slots). Must be on for them to take effect.
exteros-cheats-cheat-mode-reach-distance=Increases the distance for building, reaching items, and looting.
exteros-cheats-cheat-mode-crafting-speed=Increases the manual crafting speed of the player.
exteros-cheats-cheat-mode-mining-speed=Increases the manual mining speed of the player.
exteros-cheats-cheat-mode-inventory-bonus=Adds extra slots to the player's inventory.
