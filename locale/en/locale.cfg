[mod-name]
Exteros-QoL-Cheats=Exteros QoL System - Cheats

[mod-description]
Exteros-QoL-Cheats=Cheat addon for Exteros' QoL System: reach distance, crafting and mining speed, inventory slots, stack size, productivity on every recipe, and roboport logistic, construction and radar range. Nothing changes until you enable Cheat Mode.

[mod-setting-name]
exteros-qol-cheat-mode-enabled=[item=iron-gear-wheel] [color=#84CDEC]Enable Cheat Mode[/color]
exteros-qol-cheat-productivity-unlocked=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Unlock
exteros-qol-cheat-productivity-cap=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Cap (%)
exteros-qol-cheat-stack-size-mode=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Mode
exteros-qol-cheat-stack-size-value=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Value
cheat-reach-distance=[color=#E0807A][font=default-bold]Character[/font][/color]: Reach Distance Bonus
cheat-crafting-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Crafting Speed Bonus
cheat-mining-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Mining Speed Bonus
cheat-inventory-bonus=[color=#E0807A][font=default-bold]Character[/font][/color]: Inventory Slots Bonus
exteros-qol-cheat-roboport-logistic-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Logistic Radius Mode
exteros-qol-cheat-roboport-logistic-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Logistic Radius Value
exteros-qol-cheat-roboport-construction-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Construction Radius Mode
exteros-qol-cheat-roboport-construction-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Construction Radius Value
