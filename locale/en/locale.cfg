exteros-qol-cheat-roboport-personal-construction-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Personal Roboport Construction Radius Value
exteros-qol-cheat-roboport-radar-range-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Radar Range Mode
