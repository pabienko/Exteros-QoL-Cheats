[mod-name]
Exteros-QoL-Cheats=Exteros QoL System - Cheats

[mod-description]
Exteros-QoL-Cheats=Чит-дополнение к Exteros' QoL System: дальность действия, скорость крафта и добычи, слоты инвентаря, размер стака, продуктивность для всех рецептов и дальность логистики, строительства и радара робопортов. Ничего не меняется, пока не включён Cheat Mode.

[mod-setting-name]
exteros-qol-cheat-mode-enabled=[item=iron-gear-wheel] [color=#84CDEC]Включить чит-режим[/color]
exteros-qol-cheat-productivity-unlocked=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Разблокировать
exteros-qol-cheat-productivity-cap=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Предел (%)
exteros-qol-cheat-stack-size-mode=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Режим
exteros-qol-cheat-stack-size-value=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Значение
cheat-reach-distance=[color=#E0807A][font=default-bold]Character[/font][/color]: Бонус дистанции досягаемости
cheat-crafting-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Бонус скорости крафта
cheat-mining-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Бонус скорости ручной добычи
cheat-inventory-bonus=[color=#E0807A][font=default-bold]Character[/font][/color]: Бонус слотов инвентаря

[mod-setting-description]
exteros-qol-cheat-mode-enabled=Включает дополнительные чит-настройки (дальность, скорость и т. д.). Для использования читов должно быть включено.
exteros-qol-cheat-productivity-unlocked=Позволяет использовать модули продуктивности во ВСЕХ рецептах. (Требуется чит-режим)
exteros-qol-cheat-productivity-cap=Задаёт максимальный процент продуктивности для рецептов. (Требуется чит-режим)
exteros-qol-cheat-stack-size-mode=Выберите, умножать исходные размеры пачек или задавать абсолютное значение. (Требуется чит-режим)
exteros-qol-cheat-stack-size-value=Множитель или абсолютное значение для размера пачки. (Требуется чит-режим)
cheat-reach-distance=Увеличивает дальность строительства, взаимодействия с предметами и подбора предметов с земли.
cheat-crafting-speed=Увеличивает скорость ручного крафта игрока.
cheat-mining-speed=Увеличивает скорость ручной добычи игрока.
cheat-inventory-bonus=Добавляет дополнительные слоты в инвентарь игрока.

[exteros-qol-hub-setting]
cheat-reach-distance=Бонус дистанции
cheat-crafting-speed=Значение
cheat-mining-speed=Значение
cheat-inventory-bonus=Значение

[exteros-qol-cheats-hub]
reach=Дальность действия
crafting-speed=Скорость крафта
mining-speed=Скорость добычи
inventory-slots=Слоты инвентаря
