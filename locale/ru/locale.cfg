[mod-setting-name]
exteros-cheats-productivity-unlocked=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Разблокировать
exteros-cheats-productivity-cap=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Предел (%)
exteros-cheats-stack-size-mode=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Режим
exteros-cheats-stack-size-value=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Значение

[mod-setting-description]
exteros-cheats-productivity-unlocked=Позволяет использовать модули продуктивности во ВСЕХ рецептах.
exteros-cheats-productivity-cap=Задаёт максимальный процент продуктивности для рецептов.
exteros-cheats-stack-size-mode=Выберите, умножать исходные размеры пачек или задавать абсолютное значение.
exteros-cheats-stack-size-value=Множитель или абсолютное значение для размера пачки.

[exteros-lib-feature-name]
exteros-cheats-cheat-mode=Cheat Mode

[exteros-lib-setting-name]
exteros-cheats-cheat-mode-enabled=[item=iron-gear-wheel] [color=#84CDEC]Включить Cheat Mode[/color]
exteros-cheats-cheat-mode-reach-distance=[color=#E0807A][font=default-bold]Character[/font][/color]: Бонус дистанции досягаемости
exteros-cheats-cheat-mode-crafting-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Бонус скорости крафта
exteros-cheats-cheat-mode-mining-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Бонус скорости ручной добычи
exteros-cheats-cheat-mode-inventory-bonus=[color=#E0807A][font=default-bold]Character[/font][/color]: Бонус слотов инвентаря

[exteros-lib-setting-description]
exteros-cheats-cheat-mode-enabled=Включает дополнительные чит-настройки (дальность, скорость и т. д.). Для использования читов должно быть включено.
exteros-cheats-cheat-mode-reach-distance=Увеличивает дальность строительства, взаимодействия с предметами и подбора предметов с земли.
exteros-cheats-cheat-mode-crafting-speed=Увеличивает скорость ручного крафта игрока.
exteros-cheats-cheat-mode-mining-speed=Увеличивает скорость ручной добычи игрока.
exteros-cheats-cheat-mode-inventory-bonus=Добавляет дополнительные слоты в инвентарь игрока.
