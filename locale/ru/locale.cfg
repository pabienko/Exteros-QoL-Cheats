[mod-name]
Exteros-QoL-Cheats=Exteros QoL System - Cheats

[mod-description]
Exteros-QoL-Cheats=Чит-дополнение к Exteros' QoL System: дальность действия, скорость крафта и добычи, слоты инвентаря, размер стака, продуктивность для всех рецептов, параметры топлива (энергия, ускорение, макс. скорость) и доля возврата переработчика для повышения качества. Заменяет Adjustable Fuel Stats и Adjustable Recycler. Ничего не меняется, пока не включён Cheat Mode.

[mod-setting-name]
exteros-qol-cheat-mode-enabled=Включить чит-режим
exteros-qol-cheat-productivity-unlocked=(Чит) Разблокировать продуктивность
exteros-qol-cheat-productivity-cap=(Чит) Предел продуктивности (%)
exteros-qol-cheat-stack-size-mode=(Чит) Режим размера пачки
exteros-qol-cheat-stack-size-value=(Чит) Значение размера пачки
cheat-reach-distance=(Чит) Бонус дистанции досягаемости
cheat-crafting-speed=(Чит) Бонус скорости крафта
cheat-mining-speed=(Чит) Бонус скорости ручной добычи
cheat-inventory-bonus=(Чит) Бонус слотов инвентаря

[mod-setting-description]
exteros-qol-cheat-mode-enabled=Включает дополнительные чит-настройки (дальность, скорость и т. д.). Для использования читов должно быть включено.
exteros-qol-cheat-productivity-unlocked=Позволяет использовать модули продуктивности во ВСЕХ рецептах. (Требуется чит-режим)
exteros-qol-cheat-productivity-cap=Задаёт максимальный процент продуктивности для рецептов. (Требуется чит-режим)
exteros-qol-cheat-stack-size-mode=Выберите, умножать исходные размеры пачек или задавать абсолютное значение. (Требуется чит-режим)
exteros-qol-cheat-stack-size-value=Множитель или абсолютное значение для размера пачки. (Требуется чит-режим)
cheat-reach-distance=Увеличивает дальность строительства, взаимодействия с предметами и подбора предметов с земли.
cheat-crafting-speed=Увеличивает скорость ручного крафта игрока.
cheat-mining-speed=Увеличивает скорость ручной добычи игрока.
cheat-inventory-bonus=Добавляет дополнительные слоты в инвентарь игрока.
