[exteros-lib-feature-name]
exteros-cheats-cheat-mode=Cheat Mode

[exteros-lib-setting-name]
exteros-cheats-cheat-mode-enabled=[item=iron-gear-wheel] [color=#84CDEC]Zapnout Cheat Mode[/color]
exteros-cheats-cheat-mode-reach-distance=[color=#E0807A][font=default-bold]Character[/font][/color]: Bonus k dosahu (Reach)
exteros-cheats-cheat-mode-crafting-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Bonus k rychlosti výroby
exteros-cheats-cheat-mode-mining-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Bonus k rychlosti těžby
exteros-cheats-cheat-mode-inventory-bonus=[color=#E0807A][font=default-bold]Character[/font][/color]: Bonus k velikosti inventáře

[exteros-lib-setting-description]
exteros-cheats-cheat-mode-enabled=Povolí bonusy postavy (dosah, rychlost výroby a těžby, sloty inventáře). Musí být zapnuto, aby se projevily.
exteros-cheats-cheat-mode-reach-distance=Zvyšuje vzdálenost pro stavění, braní předmětů a lootování.
exteros-cheats-cheat-mode-crafting-speed=Zvyšuje rychlost ruční výroby hráče.
exteros-cheats-cheat-mode-mining-speed=Zvyšuje rychlost ruční těžby hráče.
exteros-cheats-cheat-mode-inventory-bonus=Přidá extra sloty do inventáře hráče.
