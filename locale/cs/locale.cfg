[mod-name]
Exteros-QoL-Cheats=Exteros QoL System - Cheaty

[mod-description]
Exteros-QoL-Cheats=Cheatovací doplněk k Exteros' QoL System: dosah, rychlost výroby a těžby, sloty inventáře, velikost stacků, produktivita u všech receptů, parametry paliv (výhřevnost, zrychlení, max. rychlost) a návratnost recyklace pro točení kvality. Nahrazuje módy Adjustable Fuel Stats a Adjustable Recycler. Nic se nezmění, dokud nezapneš Cheat Mode.

[mod-setting-name]
exteros-qol-cheat-mode-enabled=Povolit Cheat Mode
exteros-qol-cheat-productivity-unlocked=(Cheat) Odemknout Produktivitu
exteros-qol-cheat-productivity-cap=(Cheat) Limit Produktivity (%)
exteros-qol-cheat-stack-size-mode=(Cheat) Režim velikosti stacků
exteros-qol-cheat-stack-size-value=(Cheat) Hodnota velikosti stacků
cheat-reach-distance=(Cheat) Bonus k dosahu (Reach)
cheat-crafting-speed=(Cheat) Bonus k rychlosti výroby
cheat-mining-speed=(Cheat) Bonus k rychlosti těžby
cheat-inventory-bonus=(Cheat) Bonus k velikosti inventáře
exteros-qol-cheat-recycler-return-rate=(Cheat) Návratnost recyklace (%)
exteros-qol-cheat-recycler-scope=(Cheat) Rozsah návratnosti recyklace

[mod-setting-description]
exteros-qol-cheat-mode-enabled=Povolí doplňková nastavení pro cheaty (dosah, rychlost atd.). Musí být ZAPNUTO pro použití jakýchkoliv cheatů.
exteros-qol-cheat-productivity-unlocked=Umožňuje použít produktivity moduly ve VŠECH receptech. (Vyžaduje Cheat Mód)
exteros-qol-cheat-productivity-cap=Nastavuje maximální procento produktivity pro recepty. (Vyžaduje Cheat Mód)
exteros-qol-cheat-stack-size-mode=Zvolte, zda chcete násobit původní velikosti stacků nebo nastavit absolutní hodnotu. (Vyžaduje Cheat Mód)
exteros-qol-cheat-stack-size-value=Násobitel nebo absolutní hodnota pro velikost stacků. (Vyžaduje Cheat Mód)
cheat-reach-distance=Zvyšuje vzdálenost pro stavění, braní předmětů a lootování.
cheat-crafting-speed=Zvyšuje rychlost ruční výroby hráče.
cheat-mining-speed=Zvyšuje rychlost ruční těžby hráče.
cheat-inventory-bonus=Přidá extra sloty do inventáře hráče.
exteros-qol-cheat-recycler-return-rate=Kolik recyklátor vrátí, v procentech. Ve vanilla hře 25. Které recepty to ovlivní, určuje Rozsah návratnosti recyklace; šrot se nemění nikdy. (Vyžaduje Cheat Mód)
exteros-qol-cheat-recycler-scope=Na které recyklační recepty se návratnost vztahuje. Jen sám na sebe: předměty, které se recyklují samy na sebe (pláty, plast, …). Všechny recepty: každý recyklační recept kromě šrotu. (Vyžaduje Cheat Mód)

[string-mod-setting]
exteros-qol-cheat-recycler-scope-self-only=Jen sám na sebe
exteros-qol-cheat-recycler-scope-all=Všechny recepty (kromě šrotu)

[exteros-qol-cheats]
fuel-energy-name=(Cheat) __1__: energie (MJ)
fuel-accel-name=(Cheat) __1__: zrychlení
fuel-speed-name=(Cheat) __1__: max. rychlost
fuel-energy-description=Výhřevnost __1__ v MJ. Ve vanilla hře: __2__. (Vyžaduje Cheat Mód)
fuel-accel-description=Násobič zrychlení vozidla při spalování __1__. Ve vanilla hře: __2__. (Vyžaduje Cheat Mód)
fuel-speed-description=Násobič maximální rychlosti vozidla při spalování __1__. Ve vanilla hře: __2__. (Vyžaduje Cheat Mód)
