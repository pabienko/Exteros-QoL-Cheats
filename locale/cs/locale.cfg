[mod-name]
Exteros-QoL-Cheats=Exteros' Cheats

[mod-description]
Exteros-QoL-Cheats=Samostatný mód s cheaty: dosah, rychlost výroby a těžby, sloty inventáře, velikost stacků, produktivita receptů a dosahy roboportů. Výchozí nastavení nic nemění; bonusy postavy navíc potřebují zapnutý Cheat Mode v Exteros' Hubu.

[mod-setting-name]
exteros-cheats-productivity-unlocked=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Odemknout
exteros-cheats-productivity-cap=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Limit (%)
exteros-cheats-stack-size-mode=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Režim
exteros-cheats-stack-size-value=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Hodnota
exteros-cheats-roboport-range-logistic-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Režim dosahu logistiky
exteros-cheats-roboport-range-logistic-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Hodnota dosahu logistiky
exteros-cheats-roboport-range-construction-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Režim dosahu stavění
exteros-cheats-roboport-range-construction-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Hodnota dosahu stavění
exteros-cheats-roboport-range-personal-construction-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Režim dosahu stavění osobního roboportu
exteros-cheats-roboport-range-personal-construction-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Hodnota dosahu stavění osobního roboportu
exteros-cheats-roboport-range-radar-range-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Režim dosahu radaru
exteros-cheats-roboport-range-radar-range-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Hodnota dosahu radaru

[mod-setting-description]
exteros-cheats-productivity-unlocked=Umožňuje použít moduly produktivity ve VŠECH receptech.
exteros-cheats-productivity-cap=Nastavuje maximální procento produktivity pro recepty.
exteros-cheats-stack-size-mode=Násob původní velikosti stacků, nebo nastav absolutní hodnotu.
exteros-cheats-stack-size-value=Násobitel nebo absolutní hodnota pro velikost stacků.
exteros-cheats-roboport-range-logistic-radius-mode=Násob dosah logistiky roboportu, nebo nastav absolutní hodnotu v dlaždicích.
exteros-cheats-roboport-range-logistic-radius-value=Násobitel nebo absolutní hodnota v dlaždicích pro dosah logistiky roboportu.
exteros-cheats-roboport-range-construction-radius-mode=Násob dosah stavění roboportu, nebo nastav absolutní hodnotu v dlaždicích.
exteros-cheats-roboport-range-construction-radius-value=Násobitel nebo absolutní hodnota v dlaždicích pro dosah stavění roboportu.
exteros-cheats-roboport-range-personal-construction-radius-mode=Násob dosah stavění osobního roboportu, nebo nastav absolutní hodnotu v dlaždicích.
exteros-cheats-roboport-range-personal-construction-radius-value=Násobitel nebo absolutní hodnota v dlaždicích pro dosah stavění osobního roboportu.
exteros-cheats-roboport-range-radar-range-mode=Násob dosah radaru roboportu, nebo nastav absolutní hodnotu v chuncích. Platí jen tam, kde má roboport výslovně nastavený dosah radaru; jinak se řídí dosahem logistiky a stavění jako obvykle.
exteros-cheats-roboport-range-radar-range-value=Násobitel nebo absolutní hodnota v chuncích pro dosah radaru roboportu.

