[mod-name]
Exteros-QoL-Cheats=Exteros QoL System - Cheaty

[mod-description]
Exteros-QoL-Cheats=Cheatovací doplněk k Exteros' QoL System: dosah, rychlost výroby a těžby, sloty inventáře, velikost stacků, produktivita u všech receptů a dosah logistiky, stavění a radaru roboportů. Nic se nezmění, dokud nezapneš Cheat Mode.

[mod-setting-name]
exteros-qol-cheat-mode-enabled=[item=iron-gear-wheel] [color=#84CDEC]Zapnout Cheat Mode[/color]
exteros-qol-cheat-productivity-unlocked=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Odemknout
exteros-qol-cheat-productivity-cap=[color=#E0807A][font=default-bold]Productivity[/font][/color]: Limit (%)
exteros-qol-cheat-stack-size-mode=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Režim
exteros-qol-cheat-stack-size-value=[color=#E0807A][font=default-bold]Stack Size[/font][/color]: Hodnota
cheat-reach-distance=[color=#E0807A][font=default-bold]Character[/font][/color]: Bonus k dosahu (Reach)
cheat-crafting-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Bonus k rychlosti výroby
cheat-mining-speed=[color=#E0807A][font=default-bold]Character[/font][/color]: Bonus k rychlosti těžby
cheat-inventory-bonus=[color=#E0807A][font=default-bold]Character[/font][/color]: Bonus k velikosti inventáře
exteros-qol-cheat-roboport-logistic-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Režim dosahu logistiky
exteros-qol-cheat-roboport-logistic-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Hodnota dosahu logistiky
exteros-qol-cheat-roboport-construction-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Režim dosahu stavění
exteros-qol-cheat-roboport-construction-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Hodnota dosahu stavění
exteros-qol-cheat-roboport-personal-construction-radius-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Režim dosahu stavění osobního roboportu
exteros-qol-cheat-roboport-personal-construction-radius-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Hodnota dosahu stavění osobního roboportu
exteros-qol-cheat-roboport-radar-range-mode=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Režim dosahu radaru
exteros-qol-cheat-roboport-radar-range-value=[color=#E0807A][font=default-bold]Roboport Range[/font][/color]: Hodnota dosahu radaru

[mod-setting-description]
exteros-qol-cheat-mode-enabled=Povolí doplňková nastavení pro cheaty (dosah, rychlost atd.). Musí být ZAPNUTO pro použití jakýchkoliv cheatů.
exteros-qol-cheat-productivity-unlocked=Umožňuje použít produktivity moduly ve VŠECH receptech. (Vyžaduje Cheat Mód)
exteros-qol-cheat-productivity-cap=Nastavuje maximální procento produktivity pro recepty. (Vyžaduje Cheat Mód)
exteros-qol-cheat-stack-size-mode=Zvolte, zda chcete násobit původní velikosti stacků nebo nastavit absolutní hodnotu. (Vyžaduje Cheat Mód)
exteros-qol-cheat-stack-size-value=Násobitel nebo absolutní hodnota pro velikost stacků. (Vyžaduje Cheat Mód)
cheat-reach-distance=Zvyšuje vzdálenost pro stavění, braní předmětů a lootování.
cheat-crafting-speed=Zvyšuje rychlost ruční výroby hráče.
cheat-mining-speed=Zvyšuje rychlost ruční těžby hráče.
cheat-inventory-bonus=Přidá extra sloty do inventáře hráče.
exteros-qol-cheat-roboport-logistic-radius-mode=Zvolte, zda chcete násobit dosah logistiky roboportu nebo nastavit absolutní hodnotu v dlaždicích. (Vyžaduje Cheat Mód)
exteros-qol-cheat-roboport-logistic-radius-value=Násobitel nebo absolutní hodnota v dlaždicích pro dosah logistiky roboportu. (Vyžaduje Cheat Mód)
exteros-qol-cheat-roboport-construction-radius-mode=Zvolte, zda chcete násobit dosah stavění roboportu nebo nastavit absolutní hodnotu v dlaždicích. (Vyžaduje Cheat Mód)
exteros-qol-cheat-roboport-construction-radius-value=Násobitel nebo absolutní hodnota v dlaždicích pro dosah stavění roboportu. (Vyžaduje Cheat Mód)
exteros-qol-cheat-roboport-personal-construction-radius-mode=Zvolte, zda chcete násobit dosah stavění osobního roboportu nebo nastavit absolutní hodnotu v dlaždicích. (Vyžaduje Cheat Mód)
exteros-qol-cheat-roboport-personal-construction-radius-value=Násobitel nebo absolutní hodnota v dlaždicích pro dosah stavění osobního roboportu. (Vyžaduje Cheat Mód)
exteros-qol-cheat-roboport-radar-range-mode=Zvolte, zda chcete násobit dosah radaru roboportu nebo nastavit absolutní hodnotu v chunkách. Platí jen tam, kde má roboport výslovně nastavený dosah radaru; jinak se dál řídí dosahem logistiky a stavění jako obvykle. (Vyžaduje Cheat Mód)
exteros-qol-cheat-roboport-radar-range-value=Násobitel nebo absolutní hodnota v chunkách pro dosah radaru roboportu. (Vyžaduje Cheat Mód)

